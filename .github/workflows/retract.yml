name: retract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  retrait:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: tests
        run: python3 -m unittest discover -s tests -v
      - name: public path
        run: |
          python3 retract.py --schema | python3 -c "import json,sys; s=json.load(sys.stdin); assert s['title']=='unforge.retract.v0'"
          python3 retract.py examples/bienvenue.txt.unforge.json examples/bienvenue.txt.retrait.json
          python3 retract.py examples/bienvenue.txt
          python3 retract.py brouillon examples/bienvenue.txt.unforge.json | python3 -c "import json,sys; c=json.load(sys.stdin); assert c['format']=='UNFORGE-RETRAIT-v1'; assert c['signature']==''; assert c['materiau'].startswith('RETRAIT|')"
          python3 retract.py examples/bienvenue.txt.unforge.json --human | python3 -c "import sys; t=sys.stdin.read(); assert 'RETIRÉ' in t; assert 'VERT' not in t; assert 'IMPRIMÉ' not in t"
          test "$(wc -c < examples/bienvenue.txt)" = "92"
          grep -q "Not Carl" examples/bienvenue.txt.unforge.json
          grep -q "Not Carl" examples/bienvenue.txt.retrait.json
